[info]
name         = "OpenID Connect Log In"
version      = "1.2.0"
description  = "Log in with an OpenID Connect provider (such as Pocket ID or Keycloak) next to the normal password log-in. People link their own account, or an administrator types their provider username. Optional (off by default): accounts from provider groups — a group mapped to an Omeka role creates or links the user and keeps their role in step."
tags         = "login, log in, authentication, SSO, single sign-on, OpenID Connect, OIDC"
license      = "GPL-3.0-or-later"
author       = "Phumraphee Sae-tang"
author_link  = "https://github.com/phumraphee"
module_link  = "https://github.com/phumraphee/OidcLogin"
support_link = "https://github.com/phumraphee/OidcLogin/issues"
configurable = true
omeka_version_constraint = "^4.0.0"
